name: Domain spikes

on:
  push:
    branches:
      - main
      - r001/multisource-foundation
    paths:
      - "spikes/spike001/**"
      - "spikes/spike002/**"
      - "spikes/spike003/**"
      - "spikes/spike004/**"
      - "spikes/spike005/**"
      - "spikes/spike006/**"
      - "spikes/spike007/**"
      - "spikes/spike008/**"
      - "spikes/spike009/**"
      - "spikes/spike011/**"
      - "spikes/spike012/**"
      - "spikes/spike013/**"
      - "spikes/spike014/**"
      - "spikes/spike015/**"
      - "spikes/spike016/**"
      - "spikes/spike017/**"
      - "spikes/spike018/**"
      - "spikes/spike019/**"
      - "spikes/spike020/**"
      - "spikes/spike021/**"
      - "spikes/spike022/**"
      - "spikes/spike023/**"
      - "spikes/spike024/**"
      - "spikes/domain-lab/**"
      - ".github/workflows/domain-spikes.yml"
  pull_request:
    paths:
      - "spikes/spike001/**"
      - "spikes/spike002/**"
      - "spikes/spike003/**"
      - "spikes/spike004/**"
      - "spikes/spike005/**"
      - "spikes/spike006/**"
      - "spikes/spike007/**"
      - "spikes/spike008/**"
      - "spikes/spike009/**"
      - "spikes/spike011/**"
      - "spikes/spike012/**"
      - "spikes/spike013/**"
      - "spikes/spike014/**"
      - "spikes/spike015/**"
      - "spikes/spike016/**"
      - "spikes/spike017/**"
      - "spikes/spike018/**"
      - "spikes/spike019/**"
      - "spikes/spike020/**"
      - "spikes/spike021/**"
      - "spikes/spike022/**"
      - "spikes/spike023/**"
      - "spikes/spike024/**"
      - "spikes/domain-lab/**"
      - ".github/workflows/domain-spikes.yml"

jobs:
  domain-spikes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Offline Python tooling regression tests
        run: python3 -m unittest discover -s scripts/r001 -p 'test_*.py' -v
      - name: Validate actual merged SQLDelight migration and queries (SQLite)
        run: python3 -m unittest discover -s spikes/spike001/host-sqlite -p 'test_*.py' -v
      - name: Compile and run domain spikes
        run: gradle -p spikes/domain-lab checkSpikes --no-daemon --stacktrace
      - name: Compile real Spike-001 host invariants
        run: gradle -p spikes/spike001/host-lab checkHost --no-daemon --stacktrace
