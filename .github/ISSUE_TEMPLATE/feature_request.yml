name: Sugerir uma melhoria
description: Explique a situação e o benefício esperado.
title: "[Sugestão]: "
body:
  - type: textarea
    id: situation
    attributes:
      label: Qual situação você quer resolver?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como a melhoria ajudaria na leitura?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: "Tipo de documento, aparelho ou limitações relevantes."
